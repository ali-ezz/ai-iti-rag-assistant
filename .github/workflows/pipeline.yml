name: pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/source_documents/**"
      - "notebooks/**"
      - "scripts/**"
      - "backend/**"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write

jobs:
  build-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-models-${{ runner.os }}-v1

      - name: Build vector store
        run: python scripts/build_vector_store.py --reset

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen2.5:1.5b

      - name: Execute RAG pipeline notebook
        run: |
          jupyter nbconvert --to notebook --execute \
            --inplace \
            --ExecutePreprocessor.timeout=900 \
            notebooks/rag_pipeline.ipynb

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rag-pipeline-artifacts
          path: |
            data/evaluation/results.csv
            notebooks/rag_pipeline.ipynb
          if-no-files-found: error

      - name: Upload vector store
        uses: actions/upload-artifact@v4
        with:
          name: vector-store
          path: data/vector_store/
          if-no-files-found: error

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vector_store data/evaluation/results.csv notebooks/rag_pipeline.ipynb
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "CI: build vector store, run evaluation notebook"
            git push
          fi
